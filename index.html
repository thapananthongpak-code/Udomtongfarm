<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfdf9" />

    <script>
      // Apply the customer's saved text size and colour contrast before the page is drawn, so it does not jump.
      try {
        var size = window.localStorage.getItem("text-size");
        if (size === "lg" || size === "xl") document.documentElement.dataset.textSize = size;
        if (window.localStorage.getItem("contrast") === "dark") document.documentElement.dataset.contrast = "dark";
      } catch (e) {}
    </script>

    <title>อุดมทองฟาร์ม | สัตว์และพืชหายาก จังหวัดชัยภูมิ</title>
    <meta
      name="description"
      content="อุดมทองฟาร์ม จังหวัดชัยภูมิ รวมสัตว์และพืชหายาก เข้าชมฟรี มีขับรถ ATV ให้อาหารสัตว์ ที่พักโฮมสเตย์ 4 ห้อง และร้านกาแฟ"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Udomtong Farm" />
    <meta property="og:title" content="อุดมทองฟาร์ม | Udomtong Farm" />
    <meta
      property="og:description"
      content="แลนด์มาร์กใหม่ของชัยภูมิ บ้านของสัตว์และพืชหายาก เข้าชมฟรี · A new landmark in Chaiyaphum, home to rare animals and plants."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
