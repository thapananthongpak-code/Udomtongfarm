    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400..700&family=Noto+Serif+Thai:wght@500..700&display=swap"
    />

    <!-- Apply saved theme and language before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("uf_prefs");
          var p = raw ? JSON.parse(raw) : {};
          var theme = p.theme || localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var lang = p.lang || localStorage.getItem("lang");
          var d = document.documentElement;
          d.setAttribute("data-theme", theme);
          if (lang === "th" || lang === "en") d.setAttribute("lang", lang);
          if (p.textSize) d.setAttribute("data-text-size", p.textSize);
        } catch (e) {
          /* storage unavailable: keep defaults */
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Udomtong Farm",
        "alternateName": "ฟาร์มอุดมทอง",
        "url": "https://udomtongfarm.com/",
        "image": "https://udomtongfarm.com/og-image.jpg",
        "telephone": "+66811733620",
        "sameAs": ["https://www.facebook.com/Udomtongfarm"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mueang Chaiyaphum",
          "addressRegion": "Chaiyaphum",

          "addressCountry": "TH"
        }
      }
    </script>
